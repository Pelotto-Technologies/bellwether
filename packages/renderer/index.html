<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bellwether</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      body.backdrop { background: linear-gradient(#141826, #232a3d); }
      #chip {
        position: fixed; top: 8px; left: 8px; padding: 2px 8px; border-radius: 4px;
        font: 12px ui-monospace, monospace; color: #cfd6e6; background: rgba(0,0,0,.45);
      }
      body.transparent #chip { display: none; }
      #detail {
        position: fixed; top: 12px; right: 12px; width: 280px; max-height: 70vh; overflow: auto;
        padding: 10px 12px; border-radius: 6px; color: #e8ecf6; background: rgba(12,15,24,.88);
        font: 12px ui-monospace, monospace; border: 1px solid rgba(255,255,255,.2);
      }
      #detail[hidden] { display: none; }
      #detail h2 { margin: 0; font-size: 14px; }
      #detail .sub { margin: 2px 0 8px; opacity: .7; }
      #detail ul { list-style: none; margin: 0; padding: 0; }
      #detail li { margin: 6px 0; }
      #detail .line { opacity: .75; }
      #detail h3 { margin: 10px 0 2px; font-size: 11px; font-weight: normal; letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
      #detail .model { margin-top: 2px; opacity: .85; }
      #detail .vit { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
      #detail .vit > span:first-child { width: 18px; opacity: .7; }
      #detail .vit .bar { flex: 1; height: 6px; background: rgba(255,255,255,.14); border-radius: 1px; overflow: hidden; }
      #detail .vit .bar i { display: block; height: 100%; }
      #detail .vit .pct { width: 34px; text-align: right; }
      #detail .quest { margin-top: 2px; opacity: .75; font-style: italic; }
      #detail .kill { float: right; margin-left: 6px; padding: 0 6px; cursor: pointer; border-radius: 3px; font: 11px ui-monospace, monospace;
        color: #ffb3b3; background: rgba(255,77,77,.12); border: 1px solid rgba(255,77,77,.45); }
      #detail .kill:hover { background: rgba(255,77,77,.3); color: #fff; }
      #detail .kill:disabled { opacity: .5; cursor: default; }
      #detail .enter { margin: 0 0 8px; padding: 3px 10px; cursor: pointer; border-radius: 3px; font: 12px ui-monospace, monospace;
        color: #fff2c0; background: rgba(255,210,63,.14); border: 1px solid rgba(255,210,63,.6); }
      #detail .enter:hover { background: rgba(255,210,63,.32); color: #fff; }
      /* Camp scene: the party window and the back button. */
      #camp-panel, #camp-back { display: none; }
      body.camp-view #camp-panel { display: flex; }
      body.camp-view #camp-back { display: block; }
      body.camp-view #exit-map, body.camp-view #detail { display: none !important; }
      body.no-panel #camp-panel { display: none !important; }
      #camp-back {
        position: fixed; bottom: 12px; left: 12px; padding: 4px 12px; cursor: pointer; border-radius: 0;
        font: 12px ui-monospace, monospace; color: #f3f1e8; background: rgba(12,15,24,.88); border: 2px solid rgba(255,255,255,.7);
        text-shadow: 1px 1px 0 #000; -webkit-app-region: no-drag;
      }
      body.transparent #camp-back { display: none !important; }
      #camp-back:hover, #camp-back:focus-visible { background: rgba(40,48,72,.95); outline: 1px solid #fff; }
      #camp-panel {
        --win-bg: #1c2b5a; --win-bg2: #0c1230; --win-edge: #e9e6dc; --win-accent: #59d66b; --win-text: #f3f1e8;
        position: fixed; top: 12px; right: 12px; bottom: 12px; width: min(348px, 42vw); flex-direction: column; box-sizing: border-box;
        padding: 12px 12px 8px; color: var(--win-text); font: 12px/1.35 ui-monospace, 'Courier New', monospace; text-shadow: 1px 1px 0 rgba(0,0,0,.7);
        background: linear-gradient(var(--win-bg), var(--win-bg2));
        border: 3px solid var(--win-edge); outline: 2px solid #05070f; outline-offset: -1px;
        box-shadow: inset 0 0 0 2px rgba(255,255,255,.14);
        clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
        -webkit-app-region: no-drag;
      }
      #camp-panel[hidden] { display: none !important; }
      #camp-body { overflow-y: auto; flex: 1; padding-right: 2px; scrollbar-width: thin; }
      #camp-panel header { position: relative; padding-bottom: 7px; margin-bottom: 7px; border-bottom: 2px solid var(--win-edge); }
      #camp-panel h2 { margin: 0 70px 2px 0; font-size: 15px; letter-spacing: .03em; }
      #camp-panel h2 .br { font-weight: normal; opacity: .78; font-size: 12px; }
      #camp-panel .pill { position: absolute; top: 1px; right: 0; padding: 0 6px; border: 2px solid currentColor; font-size: 11px; text-transform: uppercase; background: rgba(0,0,0,.35); }
      #camp-panel .sub, #camp-panel .quest, #camp-panel .gitline { opacity: .85; }
      #camp-panel .quest { font-style: italic; }
      #camp-panel .gitline { color: #ffd86a; }
      #camp-panel ul.party { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
      #camp-panel li.mem { display: flex; gap: 8px; padding: 6px; background: rgba(0,0,0,.28); border: 2px solid rgba(255,255,255,.22); border-left: 4px solid currentColor; }
      #camp-panel li.mem.working { color: #3ddc84; } #camp-panel li.mem.done { color: #ffd23f; } #camp-panel li.mem.blocked { color: #ff4d4d; }
      #camp-panel li.mem.idle { color: #d8d8d8; } #camp-panel li.mem.unknown { color: #7a7a7a; }
      #camp-panel li.mem > .body { color: var(--win-text); flex: 1; min-width: 0; }
      #camp-panel .face { flex: none; width: 54px; height: 60px; background: rgba(0,0,0,.4); border: 2px solid var(--win-edge); display: grid; place-items: center; overflow: hidden; }
      #camp-panel .face img { width: 54px; height: 60px; image-rendering: pixelated; display: block; }
      #camp-panel .top { display: flex; align-items: baseline; gap: 6px; }
      #camp-panel .top b { text-transform: capitalize; font-size: 13px; }
      #camp-panel .top i { opacity: .7; font-style: normal; }
      #camp-panel .kill { margin-left: auto; padding: 0 6px; cursor: pointer; font: 10px ui-monospace, monospace; color: #ffb3b3; background: rgba(255,77,77,.12); border: 1px solid rgba(255,77,77,.5); }
      #camp-panel .kill:hover { background: rgba(255,77,77,.32); color: #fff; }
      #camp-panel .kill:disabled { opacity: .5; cursor: default; }
      #camp-panel .model { opacity: .85; }
      #camp-panel .vit { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
      #camp-panel .vit .lbl { width: 16px; font-weight: bold; opacity: .85; }
      #camp-panel .vit .cells { display: flex; gap: 1px; flex: 1; }
      #camp-panel .vit .cells i { flex: 1; height: 6px; background: rgba(255,255,255,.14); }
      #camp-panel .vit .pct { width: 34px; text-align: right; }
      #camp-panel .act { margin-top: 3px; font-weight: bold; }
      #camp-panel .act em { color: #ff9a8a; font-weight: normal; }
      #camp-panel .line { opacity: .72; word-break: break-word; }
      #camp-panel li.mem.tired { border-color: rgba(255,154,138,.5); }
      #camp-hint { margin: 6px 0 0; padding-top: 5px; border-top: 2px solid var(--win-edge); opacity: .6; font-size: 11px; text-align: center; }
      /* Level badge and thin XP bar (map detail panel and camp party panel). */
      .lv { padding: 0 5px; font: bold 10px ui-monospace, monospace; color: #1b1b24; background: #ffd23f; border-radius: 0; box-shadow: 0 -1px 0 #ffd23f, 0 1px 0 #ffd23f, -1px 0 0 #ffd23f, 1px 0 0 #ffd23f; font-style: normal; }
      .xpbar { height: 3px; margin: 3px 0 2px; background: rgba(255,255,255,.16); }
      .xpbar i { display: block; height: 100%; background: #ffd23f; }
      #camp-panel .top .lv { opacity: 1; }
      #drag-bar {
        position: fixed; top: 0; left: 0; width: calc(100% - 310px); height: 22px; display: none;
        -webkit-app-region: drag; background: rgba(12,15,24,.55); color: #9aa6c4; font: 11px ui-monospace, monospace;
        line-height: 22px; text-align: center; user-select: none; border-radius: 0 0 6px 0;
      }
      body.map.transparent #drag-bar { display: block; }
      #exit-map {
        position: fixed; bottom: 12px; left: 12px; padding: 4px 10px; border-radius: 4px; display: none;
        font: 12px ui-monospace, monospace; color: #e8ecf6; background: rgba(12,15,24,.88);
        border: 1px solid rgba(255,255,255,.3); text-decoration: none; -webkit-app-region: no-drag;
      }
      body.map #exit-map { display: block; }
      #exit-map:hover, #exit-map:focus-visible { background: rgba(40,48,72,.95); outline: 1px solid #fff; }
      #detail-close { position: absolute; top: 6px; right: 8px; cursor: pointer; background: none; border: 0; color: inherit; font: inherit; }
      .st.working { color: #3ddc84; } .st.done { color: #ffd23f; } .st.blocked { color: #ff4d4d; }
      .st.idle { color: #d8d8d8; } .st.unknown { color: #7a7a7a; }
    </style>
  </head>
  <body>
    <div id="drag-bar" title="Drag to move the map">⠿ Bellwether · drag to move</div>
    <a id="exit-map" href="?mode=strip" title="Back to the strip (m)">Exit map</a>
    <div id="chip">connecting…</div>
    <button id="camp-back" title="Back to the map (Esc)">&larr; Back to map</button>
    <div id="camp-panel" hidden><div id="camp-body"></div><p id="camp-hint">Esc: back to the map</p></div>
    <div id="detail" hidden><button id="detail-close" title="Back to the map (Esc)">✕</button><div id="detail-body"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
