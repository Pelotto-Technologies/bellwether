name: Release

# Releasing = merging a PR that bumps packages/cli/package.json "version".
# On every push to main, `plan` compares v<version> against existing tags and, if the
# tag is new, `release` builds, creates the tag and GitHub Release, and `npm` publishes.
# Everything runs in this one workflow because releases created with GITHUB_TOKEN do not
# trigger other workflows.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    # Never release from a branch, even via manual dispatch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      new_tag: ${{ steps.v.outputs.new_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: v
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/cli/package.json').version")
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} exists; nothing to release."
            echo "new_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "new_tag=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: plan
    if: needs.plan.outputs.new_tag == 'true'  # skipped too when plan is skipped
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Package
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          name="bellwether-${TAG}"
          out="stage/${name}"
          mkdir -p "$out/packages/adapter" "$out/packages/renderer" "$out/packages/cli" "$out/themes"
          cp -r packages/adapter/dist packages/adapter/package.json "$out/packages/adapter/"
          cp -r packages/renderer/dist "$out/packages/renderer/"
          cp -r packages/cli/dist packages/cli/package.json "$out/packages/cli/"
          # Public packs only. Never copy the themes folder wholesale.
          for pack in neutral aesir wayfarers; do
            cp -r "themes/${pack}" "$out/themes/${pack}"
          done
          cp LICENSE README.md "$out/"
          tar -C stage -czf "${name}.tar.gz" "${name}"
          (cd stage && zip -qr "../${name}.zip" "${name}")
          ls -l "${name}.tar.gz" "${name}.zip"
          find "$out/themes" -mindepth 1 -maxdepth 1 -printf '%f\n'
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            bellwether-${{ needs.plan.outputs.tag }}.tar.gz
            bellwether-${{ needs.plan.outputs.tag }}.zip
          generate_release_notes: true

  npm:
    # Publishes @pelotto-tech/bellwether. Needs the NPM_TOKEN repository secret
    # (an npm automation token with publish rights to the @pelotto-tech scope).
    # Skipped, not failed, while the secret is unset. Provenance is only requested once
    # the repository is public; npm rejects provenance from private repositories.
    # Skipped if the version is already on npm, so a re-run or a manual publish is safe.
    needs: [plan, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm build
      - name: Already on npm?
        id: published
        run: |
          if npm view "@pelotto-tech/bellwether@${{ needs.plan.outputs.version }}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: ${{ env.NPM_TOKEN != '' && steps.published.outputs.already != 'true' }}
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --no-git-checks ${{ github.event.repository.private == false && '--provenance' || '' }}
