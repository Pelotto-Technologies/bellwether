name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="bellwether-${TAG}"
          out="stage/${name}"
          mkdir -p "$out/packages/adapter" "$out/packages/renderer" "$out/packages/cli" "$out/themes"
          cp -r packages/adapter/dist packages/adapter/package.json "$out/packages/adapter/"
          cp -r packages/renderer/dist "$out/packages/renderer/"
          cp -r packages/cli/dist packages/cli/package.json "$out/packages/cli/"
          # Public packs only. Never copy the themes folder wholesale.
          for pack in neutral aesir wayfarers; do
            cp -r "themes/${pack}" "$out/themes/${pack}"
          done
          cp LICENSE README.md "$out/"
          tar -C stage -czf "${name}.tar.gz" "${name}"
          (cd stage && zip -qr "../${name}.zip" "${name}")
          ls -l "${name}.tar.gz" "${name}.zip"
          find "$out/themes" -mindepth 1 -maxdepth 1 -printf '%f\n'
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bellwether-${{ github.ref_name }}.tar.gz
            bellwether-${{ github.ref_name }}.zip
          generate_release_notes: true

  npm:
    # Publishes @pelotto-technologies/bellwether. Needs the NPM_TOKEN repository secret
    # (an npm automation token with publish rights to the @pelotto-technologies scope).
    # Skipped, not failed, while the secret is unset.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm build
      - name: Check tag matches package version
        run: test "v$(node -p "require('./packages/cli/package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Publish
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --no-git-checks --provenance
