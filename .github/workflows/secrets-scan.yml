name: Secret scan

# Free replacement for GitHub's paid Secret Protection: runs the gitleaks CLI (pinned and
# checksum-verified) over the full history on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: 8.28.0
          SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          f="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSLf -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${f}"
          echo "${SHA256}  ${f}" | sha256sum -c -
          tar xzf "$f" gitleaks
      - name: Scan
        run: ./gitleaks git --redact --verbose --no-banner .
